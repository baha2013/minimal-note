name: Build Portable EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Auto-Find and Prepare Assets
        shell: pwsh
        run: |
          $indexFile = Get-ChildItem -Recurse -Filter "index.html" -Exclude "node_modules", "target", "src-tauri" | Select-Object -First 1
          if ($indexFile) {
            $sourceDir = $indexFile.DirectoryName
            Write-Host "Found index.html in: $sourceDir"
            New-Item -ItemType Directory -Force -Path public
            Copy-Item -Path "$sourceDir\*" -Destination public/ -Recurse -Force
          } else {
            Write-Error "CRITICAL: index.html file was not found in the repository!"
            exit 1
          }

      - name: Build Tauri EXE
        run: npx tauri build

      - name: Upload Portable EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Note-EXE
          path: src-tauri/target/release/*.exe
